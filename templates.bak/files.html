{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>Téléchargement de fichiers</h2>

  <form method="get" action="{{ url_for('files') }}">
    <div class="form-group">
      <label for="name">Nom du fichier</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        placeholder="ex: doc.txt"
        autocomplete="off"
      >
    </div>

    <button type="submit">Télécharger</button>
  </form>

  {% if listing is defined and listing %}
    <div class="alert alert-info" style="margin-top: 1.5rem;">
      <h3>Fichiers disponibles</h3>
      <ul>
        {% for filename in listing %}
          <li>
            <a href="{{ url_for('files') }}?name={{ filename | urlencode }}">
              {{ filename }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
</div>

{% endblock %}
