{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2>Outil Ping</h2>
  <p>Testez la connectivité réseau avec une adresse IP ou un nom d'hôte.</p>

  <form method="post" action="{{ url_for('ping') }}" style="margin-top: 1rem;">
    <div class="form-group">
      <label for="ip">Adresse IP ou Nom d'hôte</label>
      <input 
        type="text" 
        id="ip" 
        name="ip" 
        value="{{ ip }}" 
        placeholder="ex: 127.0.0.1 ou localhost"
        required
      >
    </div>

    <button type="submit">Lancer le Ping</button>
  </form>

  {% if output %}
    <div class="alert alert-info" style="margin-top: 1.5rem;">
      <h3>Résultat du Ping</h3>
      <pre>{{ output }}</pre>
    </div>
  {% endif %}
</div>

{% endblock %}
